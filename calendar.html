<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기상송 · 신청 현황</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js"></script>
</head>
<body>
<div class="ws-app">
  <ws-nav active="calendar"></ws-nav>

  <main class="ws-container ws-page">
    <div class="ws-page-head ws-page-head-row">
      <div><h1>신청 현황</h1><p>날짜를 누르면 그날 신청된 곡을 모두 볼 수 있어요.</p></div>
      <a class="ws-btn ws-btn-primary" href="request.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> 기상송 신청하기</a>
    </div>

    <section class="ws-card">
      <div class="ws-cal-head">
        <span class="ws-cal-month" id="month-label" aria-live="polite"></span>
        <div class="ws-cal-nav">
          <button class="ws-icon-btn" type="button" id="prev" aria-label="이전 달"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="ws-icon-btn" type="button" id="next" aria-label="다음 달"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </div>
      <div id="cal-error" hidden></div>
      <div class="ws-cal" id="cal" role="group"></div>
      <div class="ws-cal-legend"><span><i style="background:var(--mint-500)"></i>신청 건수</span><span><i style="background:var(--mint-50);border:1px solid var(--mint-500)"></i>오늘</span><span><i style="background:var(--surface-page);border:1px solid var(--line)"></i>지난 날짜 (신청 불가)</span></div>
    </section>
  </main>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  const { api, esc } = WS;
  let today = WS.todayISO();
  const cal = document.getElementById('cal');
  const label = document.getElementById('month-label');
  const errEl = document.getElementById('cal-error');

  // ?month= 이 YYYY-MM 형식이면 그 달, 아니면 이번 달
  function resolveMonth(m) {
    return /^\d{4}-(0[1-9]|1[0-2])$/.test(m || '') ? m : WS.monthOf(today);
  }

  let month = resolveMonth(WS.param('month'));
  let reqId = 0;

  // 요일 머리글은 보이기만 한다. 날짜 버튼의 aria-label에 요일까지 넣어서
  // 스크린 리더는 버튼 목록만 읽으면 된다 (grid/row 구조를 쓰지 않음).
  function head() {
    return WS.DOW.map((d, i) => `<div class="ws-cal-dow${i === 0 ? ' sun' : ''}" aria-hidden="true">${d}</div>`).join('');
  }

  function leadingSlots() {
    const n = WS.dowOf(`${month}-01`);
    return '<div class="ws-cal-day is-empty-slot" aria-hidden="true"></div>'.repeat(n);
  }

  function renderSkeleton() {
    const [y, m] = month.split('-').map(Number);
    const cells = '<div class="ws-skel ws-cal-skel" aria-hidden="true"></div>'.repeat(WS.daysInMonth(y, m));
    cal.innerHTML = head() + leadingSlots() + cells;
  }

  function renderDays(days) {
    const cells = days.map((day) => {
      const { d } = WS.parseISO(day.date);
      const isPast = day.date < today;
      const isToday = day.date === today;
      const cls = ['ws-cal-day'];
      if (isPast) cls.push('is-past');
      if (isToday) cls.push('is-today');
      const n = day.requestCount;
      const first = n > 0 && day.songs[0] ? `<span class="ws-cal-song"><b>${esc(day.songs[0].title)}</b></span>` : '';
      const more = n > 1 ? `<span class="ws-cal-song">외 ${n - 1}곡</span>` : '';
      const note = isToday ? ' 오늘' : isPast ? ' 지난 날짜' : '';
      return `<button type="button" class="${cls.join(' ')}" data-date="${day.date}"` +
        ` aria-label="${WS.formatDate(day.date)}${note}, 신청 ${n}건"${isToday ? ' aria-current="date"' : ''}>` +
        `<span class="ws-cal-num"><span>${d}</span>${n > 0 ? `<span class="ws-cal-count">${n}</span>` : ''}</span>${first}${more}</button>`;
    }).join('');
    cal.innerHTML = head() + leadingSlots() + cells;
  }

  async function load() {
    const id = ++reqId;
    label.textContent = WS.formatMonth(month);
    cal.setAttribute('aria-label', WS.formatMonth(month));
    cal.setAttribute('aria-busy', 'true');
    errEl.hidden = true;
    renderSkeleton();
    try {
      const data = await api.getCalendar(month);
      if (id !== reqId) return;
      renderDays(data.days);
    } catch (e) {
      if (id !== reqId) return;
      cal.innerHTML = '';
      WS.showError(errEl, '달력을 불러오지 못했어요.', '잠시 후 다시 시도해 주세요.', load);
      errEl.hidden = false;
    } finally {
      if (id === reqId) cal.removeAttribute('aria-busy');
    }
  }

  function go(n) {
    month = WS.shiftMonth(month, n);
    WS.setParam('month', month, true);
    load();
  }

  document.getElementById('prev').addEventListener('click', () => go(-1));
  document.getElementById('next').addEventListener('click', () => go(1));
  cal.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-date]');
    if (btn) location.href = `date.html?date=${btn.dataset.date}`;
  });
  window.addEventListener('popstate', () => {
    month = resolveMonth(WS.param('month'));
    load();
  });
  // 페이지를 연 채로 자정을 넘기면 오늘/지난 날짜 표시를 다시 그린다
  WS.onDayChange((now) => {
    today = now;
    load();
  });

  WS.setParam('month', month);
  load();
})();
</script>
</body>
</html>
