<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기상송 · 날짜별 신청곡</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages/date.css">
  <script src="js/common.js"></script>
</head>
<body>
<div class="ws-app">
  <ws-nav active="calendar"></ws-nav>

  <main class="ws-container ws-page">
    <a class="ws-btn ws-btn-ghost ws-btn-sm ws-back" id="back" href="calendar.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg> <span id="back-label">캘린더</span></a>

    <div class="ws-page-head ws-page-head-row">
      <div>
        <span class="ws-badge" id="today-badge" hidden>오늘</span>
        <h1 id="title"></h1>
        <p id="count">신청 목록을 불러오고 있어요.</p>
      </div>
      <a class="ws-btn ws-btn-primary" id="apply" href="request.html" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> 이 날짜로 신청하기</a>
      <p class="ws-caption" id="past-note" hidden>지난 날짜는 신청할 수 없어요</p>
    </div>

    <section class="ws-card" aria-labelledby="title">
      <div id="list"></div>
      <p class="ws-today-note ws-card-foot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg> 가장 먼저 접수된 곡을 대표곡으로 보여줘요. 실제 방송곡과 다를 수 있어요.</p>
    </section>
  </main>
</div>

<script src="js/api.js"></script>
<script>
/* =====================================================================
 * S-05 날짜 상세 화면 (date.html?date=YYYY-MM-DD)
 * ---------------------------------------------------------------------
 * 하루에 신청된 곡 전체를 접수 순서대로 보여 준다.
 *   - 오늘이면 "오늘" 배지 + 첫 곡에 "오늘의 대표곡" 배지
 *   - 오늘이거나 미래면 "이 날짜로 신청하기" 버튼
 *   - 지난 날짜면 버튼 대신 "지난 날짜는 신청할 수 없어요" 문구
 * 달력이나 메인에서 날짜를 눌러 들어오는 화면이다.
 * ===================================================================== */
(function () {
  const api = WS.api;

  // 보여 줄 날짜: 주소의 ?date= 가 올바르면 그 날짜, 아니면 오늘
  const qDate = WS.param('date');
  let date = WS.todayISO();
  if (WS.isValidISO(qDate)) date = qDate;

  const listEl = document.getElementById('list');   // 신청 목록 자리
  const countEl = document.getElementById('count'); // "신청 4건 · 접수 순서대로 보여요." 문구
  const apply = document.getElementById('apply');   // "이 날짜로 신청하기" 버튼
  const applyHref = 'request.html?date=' + date;    // 신청 화면으로 갈 때 날짜를 미리 채워 준다

  /* ---------- 날짜가 정해지면 바로 채울 수 있는 부분 (서버 응답과 상관없음) ---------- */
  document.title = '기상송 · ' + WS.formatDateShort(date) + ' 신청곡';               // 브라우저 탭 제목
  document.getElementById('title').textContent = WS.formatDate(date);                  // 큰 제목 "10월 21일 수요일"
  document.getElementById('back').href = 'calendar.html?month=' + WS.monthOf(date);    // "← 10월 캘린더" 링크: 그 날짜가 있는 달로
  document.getElementById('back-label').textContent = WS.parseISO(date).m + '월 캘린더';
  apply.href = applyHref;

  // 목록 불러오기. 자정을 넘기면 다시 불려서 오늘/지난 날짜 표시도 새로 계산된다.
  async function load() {
    // 오늘/지난 날짜 여부는 자정을 넘기면 바뀌므로 불러올 때마다 다시 계산한다
    const today = WS.todayISO();
    const isToday = (date === today);
    const isPast = (date < today);
    document.getElementById('today-badge').hidden = !isToday; // hidden = true 면 숨김
    apply.hidden = isPast;                                     // 지난 날짜면 신청 버튼 숨김
    document.getElementById('past-note').hidden = !isPast;     // 지난 날짜면 안내 문구 보임

    listEl.setAttribute('aria-busy', 'true');
    listEl.innerHTML = WS.skelList(3); // 로딩 중 회색 줄 3개
    try {
      const data = await api.getRequests(date);
      const requests = data.requests;
      countEl.textContent = '신청 ' + requests.length + '건 · 접수 순서대로 보여요.';

      // 세 가지 경우: 신청이 있음 / 없는데 지난 날짜 / 없는데 아직 신청 가능
      if (requests.length > 0) {
        listEl.innerHTML = WS.requestList(requests, isToday);
      } else if (isPast) {
        listEl.innerHTML = WS.emptyState('신청곡이 없었어요', '이 날짜에는 신청된 곡이 없어요.');
      } else {
        listEl.innerHTML = WS.emptyState('아직 신청곡이 없어요', '이 날짜의 첫 번째 신청자가 되어 보세요.', { href: applyHref, label: '이 날짜로 신청하기' });
      }
    } catch (e) {
      countEl.textContent = '신청 목록을 불러오지 못했어요.';
      WS.showError(listEl, '신청 목록을 불러오지 못했어요.', '잠시 후 다시 시도해 주세요.', load);
    } finally {
      listEl.removeAttribute('aria-busy');
    }
  }

  // 페이지를 연 채로 자정을 넘기면 다시 불러온다
  WS.onDayChange(load);

  // 시작
  load();
})();
</script>
</body>
</html>
