<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기상송 · 날짜별 신청곡</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/common.js"></script>
</head>
<body>
<div class="ws-app">
  <ws-nav active="calendar"></ws-nav>

  <main class="ws-container ws-page">
    <a class="ws-btn ws-btn-ghost ws-btn-sm ws-back" id="back" href="calendar.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg> <span id="back-label">캘린더</span></a>

    <div class="ws-page-head ws-page-head-row">
      <div>
        <span class="ws-badge" id="today-badge" hidden>오늘</span>
        <h1 id="title"></h1>
        <p id="count">신청 목록을 불러오고 있어요.</p>
      </div>
      <a class="ws-btn ws-btn-primary" id="apply" href="request.html" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> 이 날짜로 신청하기</a>
      <p class="ws-caption" id="past-note" hidden>지난 날짜는 신청할 수 없어요</p>
    </div>

    <section class="ws-card" aria-labelledby="title">
      <div id="list"></div>
      <p class="ws-today-note ws-card-foot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg> 가장 먼저 접수된 곡을 대표곡으로 보여줘요. 실제 방송곡과 다를 수 있어요.</p>
    </section>
  </main>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  const { api } = WS;
  const qDate = WS.param('date');
  const date = WS.isValidISO(qDate) ? qDate : WS.todayISO();
  // 오늘/지난 날짜 여부는 자정을 넘기면 바뀌므로 그때마다 다시 계산한다
  let isToday, isPast;
  const listEl = document.getElementById('list');
  const countEl = document.getElementById('count');
  const applyHref = `request.html?date=${date}`;

  document.title = `기상송 · ${WS.formatDateShort(date)} 신청곡`;
  document.getElementById('title').textContent = WS.formatDate(date);
  document.getElementById('back').href = `calendar.html?month=${WS.monthOf(date)}`;
  document.getElementById('back-label').textContent = `${WS.parseISO(date).m}월 캘린더`;
  const apply = document.getElementById('apply');
  apply.href = applyHref;

  function applyDayState(today) {
    isToday = date === today;
    isPast = date < today;
    document.getElementById('today-badge').hidden = !isToday;
    apply.hidden = isPast;
    document.getElementById('past-note').hidden = !isPast;
  }
  applyDayState(WS.todayISO());

  async function load() {
    listEl.setAttribute('aria-busy', 'true');
    listEl.innerHTML = WS.skelList(3);
    try {
      const { requests } = await api.getRequests(date);
      countEl.textContent = `신청 ${requests.length}건 · 접수 순서대로 보여요.`;
      if (!requests.length) {
        listEl.innerHTML = isPast
          ? WS.emptyState('신청곡이 없었어요', '이 날짜에는 신청된 곡이 없어요.')
          : WS.emptyState('아직 신청곡이 없어요', '이 날짜의 첫 번째 신청자가 되어 보세요.', { href: applyHref, label: '이 날짜로 신청하기' });
      } else {
        listEl.innerHTML = WS.requestList(requests, { isToday });
      }
    } catch (e) {
      countEl.textContent = '신청 목록을 불러오지 못했어요.';
      listEl.innerHTML = WS.errorBanner('신청 목록을 불러오지 못했어요.', '잠시 후 다시 시도해 주세요.', true);
      listEl.querySelector('[data-retry]').addEventListener('click', load);
    } finally {
      listEl.removeAttribute('aria-busy');
    }
  }

  WS.onDayChange((now) => {
    applyDayState(now);
    load();
  });

  load();
})();
</script>
</body>
</html>
