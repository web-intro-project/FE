<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기상송 · 오늘의 기상송</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/pages/index.css">
  <script src="js/common.js"></script>
</head>
<body>
<div class="ws-app">
  <ws-nav active="main"></ws-nav>

  <main class="ws-container ws-page">
    <div class="ws-page-head"><h1>좋은 아침이에요</h1><p>오늘 아침 기숙사에 울릴 기상송을 확인하고, 원하는 날의 곡을 신청해 보세요.</p></div>

    <div class="ws-grid-2">
      <div id="today"></div>

      <div class="ws-stack">
        <section class="ws-card">
          <h3 class="ws-card-title">내 노래로 일어나고 싶다면</h3>
          <p class="ws-card-text">날짜를 고르고 곡 제목과 가수만 적으면 끝. 로그인은 필요 없어요.</p>
          <a class="ws-btn ws-btn-primary ws-btn-block" href="request.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> 기상송 신청하기</a>
        </section>
        <section class="ws-card" aria-labelledby="week-h">
          <h3 class="ws-card-title" id="week-h">이번 주 신청 현황</h3>
          <div id="week"></div>
          <a class="ws-btn ws-btn-secondary ws-btn-block ws-btn-sm ws-card-action" href="calendar.html">달력으로 보기</a>
        </section>
      </div>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script>
/* =====================================================================
 * S-01 메인 화면 (index.html)
 * ---------------------------------------------------------------------
 * 화면 구성
 *   1) 오늘의 기상송 카드 : 오늘 아침에 나갈 곡(오늘 가장 먼저 신청된 곡)을 크게 보여 준다.
 *   2) 이번 주 신청 현황  : 내일부터 7일 동안 신청곡이 있는 날짜를 목록으로 보여 준다.
 * 두 영역은 서로 따로 불러오므로, 한쪽이 실패해도 다른 쪽은 정상으로 보인다.
 * ===================================================================== */
(function () {
  // 자주 쓰는 것은 짧은 이름으로 꺼내 둔다 (WS.esc → esc)
  const api = WS.api;   // 서버 통신 (js/api.js)
  const esc = WS.esc;   // HTML 특수문자 바꾸기 (사용자 입력은 꼭 거친다)
  const icon = WS.icon; // SVG 아이콘 모음

  // HTML에서 내용을 채워 넣을 빈 상자들
  const todayEl = document.getElementById('today'); // 오늘의 기상송 카드 자리
  const weekEl = document.getElementById('week');   // 이번 주 목록 자리

  /* =================================================================
   * 1. 오늘의 기상송 카드 (TodayCard)
   * ================================================================= */

  // 불러오는 동안 보여 줄 회색 상자(스켈레톤). 실제 카드와 같은 크기다.
  // aria-busy="true" : 화면 낭독기에게 "아직 불러오는 중"이라고 알린다.
  function todaySkeleton() {
    todayEl.innerHTML =
      '<section class="ws-today" aria-busy="true" aria-label="오늘의 기상송 불러오는 중">' +
        '<div class="ws-skel ws-skel-badge"></div>' +
        '<div class="ws-skel ws-skel-today-date"></div>' +
        '<div class="ws-skel ws-skel-today-song"></div>' +
        '<div class="ws-skel ws-skel-today-artist"></div>' +
        '<div class="ws-skel ws-skel-today-meta"></div>' +
      '</section>';
  }

  // 서버에서 받은 data 로 카드를 그린다.
  // data 모양: { date: '2026-10-20', requestCount: 2, song: { title, artist, applicantName } 또는 null }
  function renderToday(data) {
    const dateLabel = WS.formatDate(data.date); // 예: "10월 20일 화요일"

    // 경우 1) 오늘 신청곡이 없을 때 → "오늘 신청곡 없음" + 신청하기 버튼
    if (!data.song) {
      todayEl.innerHTML =
        '<section class="ws-today ws-today-empty" aria-labelledby="today-h">' +
          '<span class="ws-badge ws-badge-neutral">' + icon.music + ' 오늘의 기상송</span>' +
          '<p class="ws-today-date">' + esc(dateLabel) + '</p>' +
          '<h2 class="ws-today-song" id="today-h">오늘 신청곡 없음</h2>' +
          '<p class="ws-today-artist">아직 아무도 신청하지 않았어요. 내일 아침 곡을 먼저 신청해 보세요.</p>' +
          '<div class="ws-today-meta"><span class="ws-today-by">신청 0건</span>' +
            '<a class="ws-btn ws-btn-primary" href="request.html">' + icon.plus + ' 기상송 신청하기</a></div>' +
        '</section>';
      return; // 여기서 끝
    }

    // 경우 2) 오늘 신청곡이 있을 때 → 곡 제목·가수·신청자 + "오늘 신청 전체 보기" 링크
    // 링크의 날짜는 내 컴퓨터 날짜가 아니라 서버가 알려 준 data.date 를 쓴다.
    // (자정 무렵 컴퓨터와 서버의 날짜가 잠깐 다를 수 있기 때문)
    const song = data.song;
    todayEl.innerHTML =
      '<section class="ws-today" aria-labelledby="today-h">' +
        '<span class="ws-badge">' + icon.music + ' 오늘의 기상송</span>' +
        '<p class="ws-today-date">' + esc(dateLabel) + ' · ' + esc(WS.BROADCAST_TIME) + '</p>' +
        '<h2 class="ws-today-song" id="today-h">' + esc(song.title) + '</h2>' +
        '<p class="ws-today-artist">' + esc(song.artist) + '</p>' +
        '<div class="ws-today-meta">' +
          '<span class="ws-today-by">신청자 <strong>' + esc(song.applicantName) + '</strong> · 오늘 신청 ' + data.requestCount + '건</span>' +
          '<a class="ws-btn ws-btn-secondary ws-btn-sm" href="date.html?date=' + encodeURIComponent(data.date) + '">오늘 신청 전체 보기</a>' +
        '</div>' +
        '<p class="ws-today-note">' + icon.info + ' 오늘 가장 먼저 접수된 신청곡이에요. 실제 방송곡과 다를 수 있어요.</p>' +
      '</section>';
  }

  // 오늘의 기상송 불러오기: 스켈레톤 → 서버 요청 → 성공하면 카드, 실패하면 오류 배너
  // async 함수라서 서버 응답을 await 로 기다린다.
  async function loadToday() {
    todaySkeleton();
    try {
      const data = await api.getToday();
      renderToday(data);
    } catch (e) {
      // 빈 카드 틀을 만들고 그 안에 오류 배너. "다시 시도"를 누르면 loadToday 를 다시 실행
      todayEl.innerHTML = '<section class="ws-card"></section>';
      WS.showError(todayEl.firstElementChild, '오늘의 기상송을 불러오지 못했어요.', '잠시 후 다시 시도해 주세요.', loadToday);
    }
  }

  /* =================================================================
   * 2. 이번 주 신청 현황: 내일부터 7일
   * -----------------------------------------------------------------
   * 서버에는 "하루 단위" 대신 "한 달 단위" 요약(getCalendar)을 요청해서
   * 그중 7일 기간에 해당하는 날만 골라 낸다.
   * ================================================================= */
  async function loadWeek() {
    weekEl.innerHTML = WS.skelList(2);        // 로딩 중 회색 줄 2개
    weekEl.setAttribute('aria-busy', 'true');

    // 기간 계산: 오늘이 10/20 이면 start = 10/21, end = 10/27
    // (오늘 날짜는 함수가 불릴 때마다 새로 읽는다. 자정을 넘겨 다시 불려도 맞게 계산되도록)
    const today = WS.todayISO();
    const start = WS.addDays(today, 1);
    const end = WS.addDays(today, 7);

    // 7일이 두 달에 걸칠 수 있으니 필요한 달을 모은다
    // 예: 10/28 ~ 11/03 이면 ['2026-10', '2026-11'] 두 달을 요청해야 한다.
    const months = [WS.monthOf(start)];
    if (WS.monthOf(end) !== months[0]) months.push(WS.monthOf(end));

    try {
      // 기간 안에 있고 신청이 1건 이상인 날만 고른다
      const days = [];
      for (let i = 0; i < months.length; i++) {
        const data = await api.getCalendar(months[i]); // 한 달 치 요약
        for (let j = 0; j < data.days.length; j++) {
          const day = data.days[j];
          // "YYYY-MM-DD" 문자열은 크기 비교가 곧 날짜 비교다
          if (day.date >= start && day.date <= end && day.requestCount > 0) days.push(day);
        }
      }

      // 한 건도 없으면 안내 문장만
      if (days.length === 0) {
        weekEl.innerHTML = '<p class="ws-week-empty">이번 주는 아직 신청곡이 없어요. 첫 번째로 신청해 보세요.</p>';
        return; // return 해도 아래 finally 는 실행된다
      }

      // 날짜마다 한 줄: [일] 대표곡 제목 / "10월 21일 · 4건" → 누르면 그날 상세 화면으로
      let html = '<ul class="ws-list">';
      for (let i = 0; i < days.length; i++) {
        const day = days[i];
        html += '<li class="ws-list-item">' +
          '<span class="ws-list-order">' + WS.parseISO(day.date).d + '</span>' +
          '<a class="ws-list-body ws-list-link" href="date.html?date=' + day.date + '">' +
            '<div class="ws-list-title">' + esc(day.songs[0].title) + '</div>' +
            '<div class="ws-list-sub">' + esc(WS.formatDateShort(day.date)) + ' · ' + day.requestCount + '건</div>' +
          '</a></li>';
      }
      html += '</ul>';
      weekEl.innerHTML = html;
    } catch (e) {
      WS.showError(weekEl, '신청 현황을 불러오지 못했어요.', '잠시 후 다시 시도해 주세요.', loadWeek);
    } finally {
      // finally : 성공하든 실패하든 마지막에 항상 실행되는 부분
      weekEl.removeAttribute('aria-busy');
    }
  }

  /* =================================================================
   * 시작
   * ================================================================= */

  // 페이지를 연 채로 자정을 넘기면 새 날짜 기준으로 다시 불러온다
  WS.onDayChange(function () {
    loadToday();
    loadWeek();
  });

  // 페이지가 열리면 두 영역을 바로 불러온다
  loadToday();
  loadWeek();
})();
</script>
</body>
</html>
